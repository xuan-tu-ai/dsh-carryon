# Test overlay for scripts/offline-check.sh: a small context window and low thresholds so automatic (pressure)
# compaction runs after a few turns against scripts/fake-messages-server.mjs, and a small rescan threshold so the
# backoff after failed folds plays out within a short session.
# Usage: dsh --profile <name> --patch scripts/pressure.patch.yml ...
- id: llm-deepseek
  config:
    models:
      - id: deepseek-flash
        contextWindow: 32000
        maxTokens: 2000

- id: carryon-compaction
  config:
    thresholdRatio: 0.8
    headroomTokens: 4000
    retainTokens: 500
    rescanTokens: 1500
